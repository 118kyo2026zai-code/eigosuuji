
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語の数字フラッシュカード 1〜100</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans JP", sans-serif;
  background: #f3f0e8;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px;
}

h1 {
  font-size: clamp(22px, 5vw, 30px);
  color: #5a258f;
  text-align: center;
  margin: 8px 0;
}

.subtitle {
  color: #666;
  font-size: 14px;
  margin: 4px 0 18px;
  text-align: center;
}

.mode-area {
  width: 100%;
  max-width: 520px;
  margin-bottom: 18px;
}

.mode-area label {
  display: block;
  text-align: center;
  color: #5a258f;
  font-weight: bold;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  border: 2px solid #7b3fc6;
  border-radius: 12px;
  background: #fffdf8;
  color: #5a258f;
  font-weight: bold;
}

.progress-area {
  width: 100%;
  max-width: 520px;
  margin-bottom: 14px;
}

.progress-text {
  text-align: center;
  font-size: 15px;
  margin-bottom: 8px;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: #ddd5e7;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 1%;
  background: #7b3fc6;
  transition: width 0.2s;
}

.card {
  width: 100%;
  max-width: 520px;
  height: clamp(260px, 48vh, 370px);
  min-height: 250px;
  background: #fffdf8;
  border: 3px solid #7b3fc6;
  border-radius: 24px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  user-select: none;
  text-align: center;
  padding: 15px;
}

.card-label {
  font-size: 14px;
  color: #888;
  margin-bottom: 18px;
}

.card-main {
  color: #5a258f;
  font-size: clamp(76px, 19vw, 130px);
  font-weight: bold;
  line-height: 1.1;
  overflow-wrap: anywhere;
  padding: 0 8px;
}

.card-main.word {
  font-size: clamp(38px, 9vw, 72px);
}

.card-hint {
  color: #888;
  font-size: 15px;
  margin-top: 22px;
}

.speaker {
  color: #7b3fc6;
  margin-bottom: 12px;
}

.buttons {
  width: 100%;
  max-width: 520px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 14px;
  min-height: 58px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  padding: 12px 8px;
  font-family: inherit;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.35;
  cursor: default;
}

.main-button {
  grid-column: 1 / -1;
  background: #7b3fc6;
  color: white;
  font-size: 21px;
  min-height: 68px;
}

.nav-button {
  background: #fffdf8;
  color: #5a258f;
  border: 2px solid #d7c4ed;
}

.audio-button {
  grid-column: 1 / -1;
  background: #f5e7c2;
  color: #664500;
}

.restart-button {
  width: 100%;
  max-width: 520px;
  background: #e7e0ef;
  color: #5a258f;
  margin-top: 12px;
}

.message {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin: 16px 0 4px;
  min-height: 22px;
}

@media (max-height: 600px) {
  body {
    padding-top: 8px;
  }

  .subtitle {
    margin-bottom: 8px;
  }

  .card {
    height: 220px;
    min-height: 210px;
  }

  .buttons {
    margin-top: 10px;
    gap: 8px;
  }

  button {
    min-height: 46px;
  }
}
</style>
</head>

<body>

<h1>英語の数字フラッシュカード</h1>
<p class="subtitle">見て・聞いて・答えてみよう！</p>

<!-- 学習モード -->
<div class="mode-area">
  <label for="modeSelect">学習モードを選ぼう</label>
  <select id="modeSelect">
    <option value="forward">数字 → 英語</option>
    <option value="reverse">英語 → 数字</option>
  </select>
</div>

<!-- 進み具合 -->
<div class="progress-area">
  <div class="progress-text" id="progressText">1 / 100</div>
  <div class="progress-track">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<!-- カード -->
<div class="card">

  <div class="card-label" id="cardLabel">数字</div>

  <div class="speaker" id="speaker"></div>

  <div class="card-main" id="cardMain">1</div>

  <div class="card-hint" id="cardHint">
    英語で何と言うかな？
  </div>

</div>

<!-- 操作ボタン -->
<div class="buttons">

  <button class="nav-button" id="prevButton">
    ← 前へ
  </button>

  <button class="nav-button" id="audioButton">
    🔊 もう一度聞く
  </button>

  <button class="main-button" id="mainButton">
    答えを見る →
  </button>

</div>

<button class="restart-button" id="restartButton">
  最初からやり直す
</button>

<div class="message" id="message">
  英語で考えたら答えを確認しよう！
</div>

<script>

// 1〜100の英語表記
const numberWords = [
  "",
  "one", "two", "three", "four", "five",
  "six", "seven", "eight", "nine", "ten",
  "eleven", "twelve", "thirteen", "fourteen", "fifteen",
  "sixteen", "seventeen", "eighteen", "nineteen", "twenty",
  "twenty-one", "twenty-two", "twenty-three", "twenty-four",
  "twenty-five", "twenty-six", "twenty-seven", "twenty-eight",
  "twenty-nine", "thirty",
  "thirty-one", "thirty-two", "thirty-three", "thirty-four",
  "thirty-five", "thirty-six", "thirty-seven", "thirty-eight",
  "thirty-nine", "forty",
  "forty-one", "forty-two", "forty-three", "forty-four",
  "forty-five", "forty-six", "forty-seven", "forty-eight",
  "forty-nine", "fifty",
  "fifty-one", "fifty-two", "fifty-three", "fifty-four",
  "fifty-five", "fifty-six", "fifty-seven", "fifty-eight",
  "fifty-nine", "sixty",
  "sixty-one", "sixty-two", "sixty-three", "sixty-four",
  "sixty-five", "sixty-six", "sixty-seven", "sixty-eight",
  "sixty-nine", "seventy",
  "seventy-one", "seventy-two", "seventy-three", "seventy-four",
  "seventy-five", "seventy-six", "seventy-seven", "seventy-eight",
  "seventy-nine", "eighty",
  "eighty-one", "eighty-two", "eighty-three", "eighty-four",
  "eighty-five", "eighty-six", "eighty-seven", "eighty-eight",
  "eighty-nine", "ninety",
  "ninety-one", "ninety-two", "ninety-three", "ninety-four",
  "ninety-five", "ninety-six", "ninety-seven", "ninety-eight",
  "ninety-nine", "one hundred"
];

// 現在の数字
let currentNumber = 1;

// 学習モード
let mode = "forward";

// 答えを表示しているか
let isAnswer = false;

// HTML要素
const modeSelect = document.getElementById("modeSelect");
const cardLabel = document.getElementById("cardLabel");
const cardMain = document.getElementById("cardMain");
const cardHint = document.getElementById("cardHint");
const speaker = document.getElementById("speaker");

const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

const mainButton = document.getElementById("mainButton");
const prevButton = document.getElementById("prevButton");
const audioButton = document.getElementById("audioButton");
const restartButton = document.getElementById("restartButton");

const message = document.getElementById("message");

// 英語音声を再生
function speakWord() {

  if (!("speechSynthesis" in window)) {
    message.textContent = "音声読み上げに対応していません。";
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(
    numberWords[currentNumber]
  );

  utterance.lang = "en-US";
  utterance.rate = 0.8;
  utterance.pitch = 1;

  const voices = speechSynthesis.getVoices();

  const englishVoice =
    voices.find(v => v.lang.toLowerCase() === "en-us") ||
    voices.find(v => v.lang.toLowerCase().startsWith("en-"));

  if (englishVoice) {
    utterance.voice = englishVoice;
  }

  speechSynthesis.speak(utterance);
}

// 画面を更新
function renderCard() {

  if (mode === "forward") {

    // 数字から英語モード
    if (isAnswer) {

      cardLabel.textContent = "英語";
      cardMain.textContent = numberWords[currentNumber];
      cardMain.classList.add("word");
      speaker.textContent = "🔊";
      cardHint.textContent = "英語の音声を聞こう";

      mainButton.textContent =
        currentNumber === 100
          ? "終了！"
          : "次の数字へ →";

      message.textContent =
        currentNumber === 100
          ? "100までよく頑張りました！"
          : "次へを押すと、次の数字になります。";

    } else {

      cardLabel.textContent = "数字";
      cardMain.textContent = currentNumber;
      cardMain.classList.remove("word");
      speaker.textContent = "";
      cardHint.textContent = "英語で何と言うかな？";

      mainButton.textContent = "答えを見る →";

      message.textContent =
        "英語で考えたら答えを確認しよう！";
    }

  } else {

    // 英語から数字モード
    if (isAnswer) {

      cardLabel.textContent = "正解の数字";
      cardMain.textContent = currentNumber;
      cardMain.classList.remove("word");
      speaker.textContent = "";
      cardHint.textContent = "正解を確認しよう！";

      mainButton.textContent =
        currentNumber === 100
          ? "終了！"
          : "次の問題へ →";

      message.textContent =
        currentNumber === 100
          ? "100までよく頑張りました！"
          : "次へを押すと、次の英語が流れます。";

    } else {

      cardLabel.textContent = "英語を聞こう";
      cardMain.textContent = "？？？";
      cardMain.classList.remove("word");
      speaker.textContent = "🔊";
      cardHint.textContent = "聞こえた数字を答えてね！";

      mainButton.textContent = "答えを見る →";

      message.textContent =
        "音声を聞いて、数字を考えよう！";
    }
  }

  progressText.textContent =
    currentNumber + " / 100";

  progressBar.style.width =
    currentNumber + "%";

  prevButton.disabled =
    currentNumber === 1 && !isAnswer;

  mainButton.disabled =
    currentNumber === 100 && isAnswer;
}

// 問題の音声を再生
function playQuestionAudio() {

  if (mode === "reverse" && !isAnswer) {
    speakWord();
  }
}

// メインボタン
function nextAction() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  if (!isAnswer) {

    // 答えを表示
    isAnswer = true;
    renderCard();

    // 数字→英語モードでは答えの音声を再生
    if (mode === "forward") {
      speakWord();
    }

  } else {

    // 次の数字へ
    if (currentNumber >= 100) {
      return;
    }

    currentNumber++;
    isAnswer = false;

    renderCard();

    // 英語→数字モードでは次の問題を読み上げる
    playQuestionAudio();
  }
}

// 前の問題へ
function goPrevious() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  if (isAnswer) {

    // 答えから問題に戻る
    isAnswer = false;
    renderCard();

    // 逆モードなら問題の音声を再生
    playQuestionAudio();

  } else {

    if (currentNumber <= 1) {
      return;
    }

    currentNumber--;
    isAnswer = true;

    renderCard();

    // 前の問題の答えを確認する
    if (mode === "forward") {
      speakWord();
    }
  }
}

// もう一度聞く
function repeatAudio() {

  if (mode === "forward") {

    // 答えを表示していない場合は答えを出す
    if (!isAnswer) {
      isAnswer = true;
      renderCard();
    }

    speakWord();

  } else {

    // 逆モードでは問題の英語を再生
    if (!isAnswer) {
      speakWord();
    } else {
      speakWord();
    }
  }
}

// モード変更
function changeMode() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  mode = modeSelect.value;
  currentNumber = 1;
  isAnswer = false;

  renderCard();

  // 逆モードを選んだときは最初の音声を再生
  if (mode === "reverse") {
    speakWord();
  }
}

// 最初から
function restart() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  currentNumber = 1;
  isAnswer = false;

  renderCard();

  if (mode === "reverse") {
    speakWord();
  }
}

// ボタンの設定
mainButton.addEventListener("click", nextAction);

prevButton.addEventListener("click", goPrevious);

audioButton.addEventListener("click", repeatAudio);

restartButton.addEventListener("click", restart);

modeSelect.addEventListener("change", changeMode);

// 最初の画面
renderCard();

</script>

</body>
</html>
