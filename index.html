
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語の数字フラッシュカード 1〜100</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans JP", sans-serif;
  background: #f3f0e8;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px;
}

h1 {
  font-size: clamp(22px, 5vw, 30px);
  color: #5a258f;
  text-align: center;
  margin: 8px 0;
}

.subtitle {
  color: #666;
  font-size: 14px;
  margin: 4px 0 18px;
  text-align: center;
}

.settings {
  width: 100%;
  max-width: 520px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.setting label {
  display: block;
  text-align: center;
  color: #5a258f;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 7px;
}

select {
  width: 100%;
  padding: 13px 8px;
  font-size: 15px;
  border: 2px solid #7b3fc6;
  border-radius: 12px;
  background: #fffdf8;
  color: #5a258f;
  font-weight: bold;
}

.progress-area {
  width: 100%;
  max-width: 520px;
  margin-bottom: 14px;
}

.progress-text {
  text-align: center;
  font-size: 15px;
  margin-bottom: 8px;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: #ddd5e7;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 1%;
  background: #7b3fc6;
  transition: width 0.2s;
}

.card {
  width: 100%;
  max-width: 520px;
  height: clamp(260px, 48vh, 370px);
  min-height: 250px;
  background: #fffdf8;
  border: 3px solid #7b3fc6;
  border-radius: 24px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  user-select: none;
  text-align: center;
  padding: 15px;
}

.card-label {
  font-size: 14px;
  color: #888;
  margin-bottom: 18px;
}

.card-main {
  color: #5a258f;
  font-size: clamp(76px, 19vw, 130px);
  font-weight: bold;
  line-height: 1.1;
  overflow-wrap: anywhere;
  padding: 0 8px;
}

.card-main.word {
  font-size: clamp(38px, 9vw, 72px);
}

.card-hint {
  color: #888;
  font-size: 15px;
  margin-top: 22px;
}

.speaker {
  color: #7b3fc6;
  margin-bottom: 12px;
  font-size: 30px;
}

.buttons {
  width: 100%;
  max-width: 520px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 14px;
  min-height: 58px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  padding: 12px 8px;
  font-family: inherit;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.35;
  cursor: default;
}

.main-button {
  grid-column: 1 / -1;
  background: #7b3fc6;
  color: white;
  font-size: 21px;
  min-height: 68px;
}

.nav-button {
  background: #fffdf8;
  color: #5a258f;
  border: 2px solid #d7c4ed;
}

.audio-button {
  grid-column: 1 / -1;
  background: #f5e7c2;
  color: #664500;
}

.restart-button {
  width: 100%;
  max-width: 520px;
  background: #e7e0ef;
  color: #5a258f;
  margin-top: 12px;
}

.message {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin: 16px 0 4px;
  min-height: 22px;
}

@media (max-width: 380px) {
  .settings {
    gap: 7px;
  }

  select {
    font-size: 13px;
  }
}

@media (max-height: 600px) {
  body {
    padding-top: 8px;
  }

  .subtitle {
    margin-bottom: 8px;
  }

  .card {
    height: 220px;
    min-height: 210px;
  }

  .buttons {
    margin-top: 10px;
    gap: 8px;
  }

  button {
    min-height: 46px;
  }
}
</style>
</head>

<body>

<h1>英語の数字フラッシュカード</h1>
<p class="subtitle"></p>

<!-- 設定 -->
<div class="settings">

  <div class="setting">
    <label for="modeSelect">学習モード</label>
    <select id="modeSelect">
      <option value="forward">数字 → 英語</option>
      <option value="reverse">英語 → 数字</option>
    </select>
  </div>

  <div class="setting">
    <label for="orderSelect">出題順</label>
    <select id="orderSelect">
      <option value="sequential">順番</option>
      <option value="random">ランダム</option>
    </select>
  </div>

</div>

<!-- 進み具合 -->
<div class="progress-area">
  <div class="progress-text" id="progressText">
    1 / 100
  </div>

  <div class="progress-track">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<!-- カード -->
<div class="card">

  <div class="card-label" id="cardLabel">
    数字
  </div>

  <div class="speaker" id="speaker"></div>

  <div class="card-main" id="cardMain">
    1
  </div>

  <div class="card-hint" id="cardHint">
    英語で何と言うかな？
  </div>

</div>

<!-- 操作ボタン -->
<div class="buttons">

  <button class="nav-button" id="prevButton">
    ← 前へ
  </button>

  <button class="nav-button" id="audioButton">
    もう一度聞く
  </button>

  <button class="main-button" id="mainButton">
    答えを見る →
  </button>

</div>

<button class="restart-button" id="restartButton">
  最初からやり直す
</button>

<div class="message" id="message">
  
</div>

<script>

// ===================================
// 1〜100の英語表記
// ===================================

const numberWords = [
  "",
  "one", "two", "three", "four", "five",
  "six", "seven", "eight", "nine", "ten",
  "eleven", "twelve", "thirteen", "fourteen", "fifteen",
  "sixteen", "seventeen", "eighteen", "nineteen", "twenty",
  "twenty-one", "twenty-two", "twenty-three", "twenty-four",
  "twenty-five", "twenty-six", "twenty-seven", "twenty-eight",
  "twenty-nine", "thirty",
  "thirty-one", "thirty-two", "thirty-three", "thirty-four",
  "thirty-five", "thirty-six", "thirty-seven", "thirty-eight",
  "thirty-nine", "forty",
  "forty-one", "forty-two", "forty-three", "forty-four",
  "forty-five", "forty-six", "forty-seven", "forty-eight",
  "forty-nine", "fifty",
  "fifty-one", "fifty-two", "fifty-three", "fifty-four",
  "fifty-five", "fifty-six", "fifty-seven", "fifty-eight",
  "fifty-nine", "sixty",
  "sixty-one", "sixty-two", "sixty-three", "sixty-four",
  "sixty-five", "sixty-six", "sixty-seven", "sixty-eight",
  "sixty-nine", "seventy",
  "seventy-one", "seventy-two", "seventy-three", "seventy-four",
  "seventy-five", "seventy-six", "seventy-seven", "seventy-eight",
  "seventy-nine", "eighty",
  "eighty-one", "eighty-two", "eighty-three", "eighty-four",
  "eighty-five", "eighty-six", "eighty-seven", "eighty-eight",
  "eighty-nine", "ninety",
  "ninety-one", "ninety-two", "ninety-three", "ninety-four",
  "ninety-five", "ninety-six", "ninety-seven", "ninety-eight",
  "ninety-nine", "one hundred"
];

// ===================================
// 状態
// ===================================

let currentNumber = 1;
let mode = "forward";
let orderMode = "sequential";
let isAnswer = false;

// 出題する数字の順番
let questionList = [];

// 現在の問題の位置
let currentIndex = 0;

// ===================================
// HTML要素
// ===================================

const modeSelect = document.getElementById("modeSelect");
const orderSelect = document.getElementById("orderSelect");

const cardLabel = document.getElementById("cardLabel");
const cardMain = document.getElementById("cardMain");
const cardHint = document.getElementById("cardHint");
const speaker = document.getElementById("speaker");

const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

const mainButton = document.getElementById("mainButton");
const prevButton = document.getElementById("prevButton");
const audioButton = document.getElementById("audioButton");
const restartButton = document.getElementById("restartButton");

const message = document.getElementById("message");

// ===================================
// 出題順を作る
// ===================================

function createQuestionList() {

  questionList = [];

  // 1〜100を用意
  for (let i = 1; i <= 100; i++) {
    questionList.push(i);
  }

  // ランダムならシャッフル
  if (orderMode === "random") {

    for (let i = questionList.length - 1; i > 0; i--) {

      const j = Math.floor(Math.random() * (i + 1));

      [questionList[i], questionList[j]] =
      [questionList[j], questionList[i]];

    }

  }

  currentIndex = 0;
  currentNumber = questionList[currentIndex];
}

// ===================================
// 英語音声
// ===================================

function speakWord() {

  if (!("speechSynthesis" in window)) {
    message.textContent =
      "音声読み上げに対応していません。";
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(
    numberWords[currentNumber]
  );

  utterance.lang = "en-US";
  utterance.rate = 0.8;
  utterance.pitch = 1;

  const voices = speechSynthesis.getVoices();

  const englishVoice =
    voices.find(v =>
      v.lang.toLowerCase() === "en-us"
    ) ||
    voices.find(v =>
      v.lang.toLowerCase().startsWith("en-")
    );

  if (englishVoice) {
    utterance.voice = englishVoice;
  }

  speechSynthesis.speak(utterance);
}

// ===================================
// 画面更新
// ===================================

function renderCard() {

  const isLast =
    currentIndex === questionList.length - 1;

  if (mode === "forward") {

    // 数字 → 英語
    if (isAnswer) {

      cardLabel.textContent = "";

      cardMain.textContent =
        numberWords[currentNumber];

      cardMain.classList.add("word");

      speaker.textContent = "";

      cardHint.textContent =
        "";

      mainButton.textContent =
        isLast ? "終了！" : "次の数字へ →";

      message.textContent =
        isLast
          ? "100問終了！よく頑張りました！"
          : "次へを押すと次の問題になります。";

    } else {

      cardLabel.textContent = "";

      cardMain.textContent = currentNumber;

      cardMain.classList.remove("word");

      speaker.textContent = "";

      cardHint.textContent =
        "";

      mainButton.textContent =
        "答えを見る →";

      message.textContent =
        "英語で考えたら答えを確認しよう！";
    }

  } else {

    // 英語 → 数字
    if (isAnswer) {

      cardLabel.textContent = "正解の数字";

      cardMain.textContent = currentNumber;

      cardMain.classList.remove("word");

      speaker.textContent = "";

      cardHint.textContent =
        "正解を確認しよう！";

      mainButton.textContent =
        isLast ? "終了！" : "次の問題へ →";

      message.textContent =
        isLast
          ? "100問終了！よく頑張りました！"
          : "次へを押すと次の英語が流れます。";

    } else {

      cardLabel.textContent = "英語を聞こう";

      cardMain.textContent = "？？？";

      cardMain.classList.remove("word");

      speaker.textContent = "🔊";

      cardHint.textContent =
        "聞こえた数字を答えてね！";

      mainButton.textContent =
        "答えを見る →";

      message.textContent =
        "音声を聞いて数字を考えよう！";
    }
  }

  // 進み具合
  progressText.textContent =
    (currentIndex + 1) + " / 100";

  progressBar.style.width =
    ((currentIndex + 1) / 100 * 100) + "%";

  // 前へボタン
  prevButton.disabled =
    currentIndex === 0 && !isAnswer;

  // 最後の答えを表示したら終了
  mainButton.disabled =
    isLast && isAnswer;
}

// ===================================
// 逆モードの問題音声
// ===================================

function playQuestionAudio() {

  if (mode === "reverse" && !isAnswer) {
    speakWord();
  }
}

// ===================================
// 次へ・答えを見る
// ===================================

function nextAction() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  if (!isAnswer) {

    // 答えを表示
    isAnswer = true;

    renderCard();

    // 数字→英語は答えの音声を再生
    if (mode === "forward") {
      speakWord();
    }

  } else {

    // 次の問題へ
    if (currentIndex >= 99) {
      return;
    }

    currentIndex++;

    currentNumber = questionList[currentIndex];

    isAnswer = false;

    renderCard();

    // 英語→数字は問題の音声を再生
    playQuestionAudio();
  }
}

// ===================================
// 前へ
// ===================================

function goPrevious() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  if (isAnswer) {

    // 答えから問題に戻る
    isAnswer = false;

    renderCard();

    // 逆モードなら問題音声を再生
    playQuestionAudio();

  } else {

    // 前の問題の答えへ
    if (currentIndex <= 0) {
      return;
    }

    currentIndex--;

    currentNumber = questionList[currentIndex];

    isAnswer = true;

    renderCard();

    // 順方向なら答えの音声を再生
    if (mode === "forward") {
      speakWord();
    }
  }
}

// ===================================
// もう一度聞く
// ===================================

function repeatAudio() {

  if (mode === "forward") {

    // 答えがまだなら表示する
    if (!isAnswer) {
      isAnswer = true;
      renderCard();
    }

    speakWord();

  } else {

    // 逆モードは問題の英語を再生
    speakWord();
  }
}

// ===================================
// 設定変更
// ===================================

function changeSettings() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  mode = modeSelect.value;
  orderMode = orderSelect.value;

  // 新しい出題順を作る
  createQuestionList();

  isAnswer = false;

  renderCard();

  // 逆モードは最初から音声を流す
  playQuestionAudio();
}

// ===================================
// 最初からやり直す
// ===================================

function restart() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  // ランダムの場合は新しくシャッフル
  createQuestionList();

  isAnswer = false;

  renderCard();

  playQuestionAudio();
}

// ===================================
// ボタン設定
// ===================================

mainButton.addEventListener(
  "click",
  nextAction
);

prevButton.addEventListener(
  "click",
  goPrevious
);

audioButton.addEventListener(
  "click",
  repeatAudio
);

restartButton.addEventListener(
  "click",
  restart
);

modeSelect.addEventListener(
  "change",
  changeSettings
);

orderSelect.addEventListener(
  "change",
  changeSettings
);

// ===================================
// 最初の画面
// ===================================

createQuestionList();
renderCard();

</script>

</body>
</html>
